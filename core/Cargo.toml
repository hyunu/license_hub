[package]
name = "licensehub-core"
version = "0.1.0"
edition = "2024"
description = "LicenseHub certificate issuing and verification core"
license = "MIT"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
getrandom = "0.3"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde", "macros"] }
