name: Provision Oracle Backend

# Oracle 인스턴스 환경을 1회 구축한다 (Caddy, systemd, /opt/licensehub, .env).
# 수동 실행: Actions 탭 → Provision Oracle Backend → Run workflow

on:
  workflow_dispatch:

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare GitHub App key
        env:
          LH_KEY: ${{ secrets.LH_GITHUB_APP_PRIVATE_KEY }}
        run: |
          mkdir -p web/deploy/ssh
          if [ -n "$LH_KEY" ]; then
            FIRST=$(printf '%s\n' "$LH_KEY" | head -1)
            SIZE=$(printf '%s' "$LH_KEY" | wc -c)
            echo "key first line: ${FIRST}"
            echo "key size: ${SIZE} bytes"
            # PEM을 파일로 그대로 저장 → scp가 바이트 단위로 복사 (줄바꿈 안전)
            printf '%s' "$LH_KEY" > web/deploy/ssh/app.pem
            echo "app.pem written (bytes: $(wc -c < web/deploy/ssh/app.pem))"
            case "$FIRST" in
              -----BEGIN*) echo "OK: PEM 형식 확인" ;;
              *) echo "ERROR: 시크릿 값이 PEM 형식이 아닙니다. .pem 파일 내용을 넣어야 합니다." ;;
            esac
          else
            echo "WARNING: LH_GITHUB_APP_PRIVATE_KEY is EMPTY"
          fi

      - name: Copy bootstrap script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: web/deploy/ssh
          target: ~/licensehub-setup

      - name: Write env and run provisioning
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: LICENSEHUB_SIGNING_KEY,LICENSEHUB_VERIFY_URL,LICENSEHUB_ADMIN_USER,LICENSEHUB_ADMIN_PASSWORD,PROXY_DOMAIN,GITHUB_REPO,GITHUB_APP_ID,GITHUB_INSTALLATION_ID
          script: |
            set -e
            sudo mkdir -p /opt/licensehub/data /opt/licensehub/bin /opt/licensehub/frontend

            # 고정 설정 (비밀 아닌 부분)
            sudo tee /opt/licensehub/.env >/dev/null <<'EOF'
            BIND_ADDR=0.0.0.0:8080
            LICENSEHUB_DB=/opt/licensehub/data/licensehub.db
            FRONTEND_DIST=/opt/licensehub/frontend
            EOF

            # 시크릿 부분 (interpolation)
            sudo tee -a /opt/licensehub/.env >/dev/null <<EOF
            LICENSEHUB_SIGNING_KEY=${LICENSEHUB_SIGNING_KEY}
            LICENSEHUB_VERIFY_URL=${LICENSEHUB_VERIFY_URL}
            LICENSEHUB_ADMIN_USER=${LICENSEHUB_ADMIN_USER}
            LICENSEHUB_ADMIN_PASSWORD=${LICENSEHUB_ADMIN_PASSWORD}
            EOF

            # GitHub App 연동 (선택): scp로 전달된 app.pem을 배치
            if [ -s "$HOME/licensehub-setup/web/deploy/ssh/app.pem" ]; then
              sudo cp "$HOME/licensehub-setup/web/deploy/ssh/app.pem" /opt/licensehub/app.pem
              sudo chmod 600 /opt/licensehub/app.pem
              echo "--- app.pem 크기: $(sudo wc -c < /opt/licensehub/app.pem) bytes ---"
            else
              echo "--- 경고: app.pem 없음 — 개인키 미설치 ---"
            fi
            sudo tee -a /opt/licensehub/.env >/dev/null <<EOF
            GITHUB_REPO=${GITHUB_REPO}
            GITHUB_APP_ID=${GITHUB_APP_ID}
            GITHUB_INSTALLATION_ID=${GITHUB_INSTALLATION_ID}
            GITHUB_APP_PRIVATE_KEY_PATH=/opt/licensehub/app.pem
            EOF

            sudo chmod 600 /opt/licensehub/.env
            echo "--- /opt/licensehub/.env (값 숨김) ---"
            sudo sed 's/=.*$/=<redacted>/' /opt/licensehub/.env

            # Caddy 리버스프록시 도메인 (예: 146.56.111.99.sslip.io)
            sudo cp "$HOME/licensehub-setup/web/deploy/ssh/bootstrap.sh" /opt/licensehub/bootstrap.sh
            sudo bash /opt/licensehub/bootstrap.sh "${PROXY_DOMAIN}"

            # .env 변경 반영: 백엔드 서비스 재시작 (바이너리가 있으면)
            if [ -x /opt/licensehub/bin/licensehub-web-backend ]; then
              sudo systemctl restart licensehub-web || true
              sleep 2
              sudo systemctl is-active licensehub-web || true
            fi
            echo "PROVISION OK"
        env:
          LICENSEHUB_SIGNING_KEY: ${{ secrets.LICENSEHUB_SIGNING_KEY }}
          LICENSEHUB_VERIFY_URL: ${{ secrets.LICENSEHUB_VERIFY_URL }}
          LICENSEHUB_ADMIN_USER: ${{ secrets.LICENSEHUB_ADMIN_USER }}
          LICENSEHUB_ADMIN_PASSWORD: ${{ secrets.LICENSEHUB_ADMIN_PASSWORD }}
          PROXY_DOMAIN: ${{ secrets.PROXY_DOMAIN }}
          GITHUB_REPO: ${{ secrets.LH_GITHUB_REPO }}
          GITHUB_APP_ID: ${{ secrets.LH_GITHUB_APP_ID }}
          GITHUB_INSTALLATION_ID: ${{ secrets.LH_GITHUB_INSTALLATION_ID }}