name: Deploy Backend to Oracle

# SSH로 Oracle 인스턴스에 백엔드를 자동 배포한다.
# - 수동: Actions 탭 → Deploy Backend to Oracle → Run workflow
# - 자동: main 브랜치에서 core/ 또는 web/backend/ 변경 push 시

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'web/backend/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl toolchain
        run: sudo apt-get update -y && sudo apt-get install -y musl-tools

      - name: Build backend (release, musl static)
        run: cargo build --release --target x86_64-unknown-linux-musl
        working-directory: web/backend

      - name: Upload binary over SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: web/backend/target/x86_64-unknown-linux-musl/release/licensehub-web-backend
          target: ~/licensehub-bin

      - name: Restart service over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            sudo cp "$HOME/licensehub-bin/web/backend/target/x86_64-unknown-linux-musl/release/licensehub-web-backend" /opt/licensehub/bin/
            sudo chmod +x /opt/licensehub/bin/licensehub-web-backend
            sudo systemctl restart licensehub-web
            sleep 3
            STATUS=$(sudo systemctl is-active licensehub-web || true)
            echo "service status: ${STATUS}"
            if [ "${STATUS}" != "active" ]; then
              echo "--- journalctl (최근 로그) ---"
              sudo journalctl -u licensehub-web --no-pager -n 25 || true
              exit 1
            fi
            curl -sf http://127.0.0.1:8080/api/public-key >/dev/null && echo "HEALTH OK" || { echo "HEALTH CHECK FAILED"; exit 1; }