name: Deploy Backend to Oracle

# SSH로 Oracle 인스턴스에 백엔드를 자동 배포한다.
# - 수동: Actions 탭 → Deploy Backend to Oracle → Run workflow
# - 자동: main 브랜치에서 core/ 또는 web/backend/ 변경 push 시
#
# 인스턴스는 Oracle Linux 9.8 aarch64(ARM). cross(Docker)로 aarch64 musl
# 정적 바이너리를 빌드해 glibc·배포판과 무관하게 실행한다.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'web/backend/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cross
        run: |
          curl -fsSL https://github.com/cross-rs/cross/releases/latest/download/cross-x86_64-unknown-linux-musl.tar.gz -o /tmp/cross.tgz
          tar -xzf /tmp/cross.tgz -C /tmp
          sudo mv /tmp/cross /usr/local/bin/
          cross --version

      - name: Build backend (cross, aarch64 musl)
        run: |
          # path 의존성(../../core)이 cross 컨테이너에 마운트되도록 루트 워크스페이스 임시 생성
          cat > Cargo.toml <<'EOF'
          [workspace]
          resolver = "2"
          members = ["web/backend"]
          EOF
          cross build --workspace --release --target aarch64-unknown-linux-musl
          BIN=$(find . -path "*aarch64-unknown-linux-musl/release/licensehub-web-backend" -type f | head -1)
          echo "binary: ${BIN}"
          cp "${BIN}" ./licensehub-web-backend.musl

      - name: Upload binary over SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: licensehub-web-backend.musl
          target: ~/licensehub-bin

      - name: Restart service over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            sudo cp "$HOME/licensehub-bin/licensehub-web-backend.musl" /opt/licensehub/bin/licensehub-web-backend
            sudo chmod +x /opt/licensehub/bin/licensehub-web-backend
            sudo systemctl restart licensehub-web
            sleep 3
            STATUS=$(sudo systemctl is-active licensehub-web || true)
            echo "service status: ${STATUS}"
            if [ "${STATUS}" != "active" ]; then
              echo "--- journalctl (최근 로그) ---"
              sudo journalctl -u licensehub-web --no-pager -n 25 || true
              exit 1
            fi
            curl -sf http://127.0.0.1:8080/api/public-key >/dev/null && echo "HEALTH OK" || { echo "HEALTH CHECK FAILED"; exit 1; }