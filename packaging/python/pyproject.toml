[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "licensehub-licenseguard"
version = "0.1.0"
description = "LicenseGuard verification binding for licensehub-core"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
licensehub_licenseguard = ["native/**/*"]